<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sensa VPM Repository</title>
  <style>
    :root {
      --bg: #1a1b2f;
      --card-bg: #232540;
      --text: #e8e8f0;
      --text-dim: #9898b0;
      --accent: #6c5ce7;
      --accent-hover: #7f6ff0;
      --border: #2e3055;
      --success: #00cec9;
      --copy-bg: #2d2f52;
      --radius: 16px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 560px;
      width: 100%;
      padding: 48px 20px;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 32px;
    }
    header h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    header p {
      color: var(--text-dim);
      margin-top: 6px;
      font-size: 0.95rem;
    }

    /* Card */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 32px;
      margin-bottom: 16px;
    }
    .card-center {
      text-align: center;
    }

    /* VCC Button */
    .btn-vcc {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      padding: 12px 32px;
      border-radius: 10px;
      text-decoration: none;
      transition: background 0.2s, transform 0.15s;
      cursor: pointer;
      border: none;
      width: 100%;
    }
    .btn-vcc:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }
    .btn-vcc:active {
      transform: translateY(0);
    }

    /* Manual URL */
    .manual-section {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }
    .manual-label {
      font-size: 0.82rem;
      color: var(--text-dim);
      margin-bottom: 10px;
    }
    .source-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--copy-bg);
      border-radius: 8px;
      padding: 10px 14px;
      border: 1px solid var(--border);
    }
    .source-box code {
      flex: 1;
      font-size: 0.78rem;
      color: var(--accent);
      word-break: break-all;
      user-select: all;
    }
    .source-box button {
      flex-shrink: 0;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }
    .source-box button:hover { background: var(--accent-hover); }
    .source-box button.copied {
      background: var(--success);
    }

    /* Note */
    .note {
      color: var(--text-dim);
      font-size: 0.82rem;
      margin-top: 12px;
      line-height: 1.5;
    }
    .note a {
      color: var(--accent);
      text-decoration: none;
    }
    .note a:hover { text-decoration: underline; }

    /* Separator */
    .sep {
      text-align: center;
      color: var(--text-dim);
      font-size: 0.78rem;
      margin: 16px 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .sep::before,
    .sep::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Info row */
    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
    }
    .info-row + .info-row {
      border-top: 1px solid var(--border);
    }
    .info-label {
      color: var(--text-dim);
      font-size: 0.88rem;
    }
    .info-value {
      font-size: 0.88rem;
      text-align: right;
    }
    .info-value a {
      color: var(--accent);
      text-decoration: none;
    }
    .info-value a:hover { text-decoration: underline; }
    .tag {
      display: inline-block;
      background: var(--copy-bg);
      padding: 2px 10px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.82rem;
      color: var(--accent);
    }

    /* Footer */
    footer {
      text-align: center;
      margin-top: 32px;
      padding: 16px 0;
      color: var(--text-dim);
      font-size: 0.8rem;
    }
    footer a {
      color: var(--accent);
      text-decoration: none;
    }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Sensa</h1>
      <p>VRChat SPS/OGB/TPS 触点感知桥接 · VPM 包源</p>
    </header>

    <!-- One-click add -->
    <div class="card card-center">
      <p style="margin-bottom:16px;color:var(--text-dim);font-size:0.9rem;">
        点击下方按钮将 Sensa 仓库添加到 VCC / ALCOM
      </p>
      <a class="btn-vcc" href="vcc://vpm/addRepo?url=https://SeaLoong.github.io/Sensa/vpm.json">
        添加到 VCC
      </a>

      <div class="manual-section">
        <div class="manual-label">或手动添加 VPM 源地址：</div>
        <div class="source-box">
          <code id="vpmUrl">https://SeaLoong.github.io/Sensa/vpm.json</code>
          <button id="copyBtn" onclick="copyUrl()">复制</button>
        </div>
      </div>
    </div>

    <!-- Info -->
    <div class="card">
      <div class="info-row">
        <span class="info-label">包名</span>
        <span class="info-value"><code>top.sealoong.sensa</code></span>
      </div>
      <div class="info-row">
        <span class="info-label">版本</span>
        <span class="info-value"><span class="tag" id="pkgVersion">v__VERSION__</span></span>
      </div>
      <div class="info-row">
        <span class="info-label">许可</span>
        <span class="info-value">MIT</span>
      </div>
      <div class="info-row">
        <span class="info-label">GitHub</span>
        <span class="info-value"><a href="https://github.com/SeaLoong/Sensa">SeaLoong/Sensa →</a></span>
      </div>
      <div class="info-row">
        <span class="info-label">问题反馈</span>
        <span class="info-value"><a href="https://github.com/SeaLoong/Sensa/issues">Issues →</a></span>
      </div>
    </div>

    <footer>
      <p><a href="https://github.com/SeaLoong/Sensa">Sensa</a> · MIT License</p>
    </footer>
  </div>

  <script>
    function copyUrl() {
      const btn = document.getElementById('copyBtn');
      const url = document.getElementById('vpmUrl');
      navigator.clipboard.writeText(url.textContent).then(() => {
        btn.textContent = '已复制';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = '复制';
          btn.classList.remove('copied');
        }, 2000);
      });
    }
  </script>
</body>
</html>
