name: Native platform builds
on:
  workflow_call:
    inputs:
      label:
        type: string
        default: ''
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-latest, rid: win-x64}
          - {runner: windows-11-arm, rid: win-arm64}
          - {runner: ubuntu-24.04, rid: linux-x64}
          - {runner: ubuntu-24.04-arm, rid: linux-arm64}
          - {runner: macos-15-intel, rid: osx-x64}
          - {runner: macos-15, rid: osx-arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install .NET SDK
        id: dotnet-setup
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        # windows-11-arm can crash inside pwsh before the installer runs:
        # https://github.com/dotnet/runtime/issues/131636
        continue-on-error: ${{ matrix.rid == 'win-arm64' }}
        with:
          global-json-file: global.json
      - name: Retry Windows ARM SDK bootstrap once
        if: matrix.rid == 'win-arm64' && steps.dotnet-setup.outcome == 'failure'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Verify installed SDK
        run: dotnet --info
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: npm ci
      - run: npm test
      - name: Install failure diagnostics for macOS smoke tests
        if: runner.os == 'macOS'
        run: dotnet tool install --global dotnet-stack --version 10.0.750501
      - name: Native tests, self-contained smoke and archive
        env:
          TARGET_RID: ${{ matrix.rid }}
          BUILD_LABEL: ${{ inputs.label }}
        shell: bash
        run: python scripts/build-platform.py --runtime "$TARGET_RID" --label "$BUILD_LABEL"
      - name: GPU PNG replay, corruption, recovery and motion gate
        if: matrix.rid == 'win-x64'
        shell: bash
        run: |
          python -m pip install -r scripts/requirements-capture.txt
          python scripts/smoke-shader-bridge.py --exe artifacts/publish/win-x64/Sensa.exe --first tests/fixtures/shader/sps-telemetry.png --next tests/fixtures/shader/sps-telemetry-next.png --corrupt tests/fixtures/shader/corrupt-telemetry.png --recover-first tests/fixtures/shader/sps-recovery-first.png --recover-next tests/fixtures/shader/sps-recovery-next.png --report artifacts/test-results/win-x64/shader-bridge.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.rid }}
          path: artifacts/platform/${{ matrix.rid }}/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tests-${{ matrix.rid }}
          path: artifacts/test-results/${{ matrix.rid }}/
          if-no-files-found: warn
