name: Release desktop apps / 发布桌面程序
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-app-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/checks.yml
  e2e:
    needs: validate
    uses: ./.github/workflows/e2e.yml
    with:
      update_snapshots: false
  build:
    needs: e2e
    uses: ./.github/workflows/build-platforms.yml
  release:
    concurrency:
      group: sensa-preview-publication
      queue: max
      cancel-in-progress: false
    needs: [build, e2e]
    if: needs.e2e.outputs.comparison_sha == github.sha
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          path: artifacts
      - name: Create immutable release / 创建不可变发布
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          args=(release create "$GITHUB_REF_NAME" --verify-tag --title "Sensa $GITHUB_REF_NAME" --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then args+=(--prerelease); fi
          mapfile -d '' files < <(find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print0)
          gh "${args[@]}" "${files[@]}"
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then python scripts/publish-preview.py --prune-only; fi
