name: Release Windows app
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-app-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high
      - run: python -m unittest discover -s tests/scripts
      - run: dotnet restore tests/Sensa.Tests/Sensa.Tests.csproj --locked-mode
      - run: dotnet test tests/Sensa.Tests/Sensa.Tests.csproj -c Release --no-restore
      - name: Publish full application
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          if ($version -ne (Get-Content package.json | ConvertFrom-Json).version) { throw 'Tag and package version differ' }
          dotnet publish src/Sensa.csproj -c Release -r win-x64 --self-contained true -p:RestoreLockedMode=true -p:Version=$version -o artifacts/publish
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - run: python scripts/smoke.py --exe artifacts/publish/Sensa.exe
      - run: python scripts/release.py app --source artifacts/publish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-app
          path: |
            artifacts/release/
            artifacts/release-notes.txt
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-app
          path: artifacts
      - name: Create immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          args=(release create "$GITHUB_REF_NAME" --verify-tag --title "Sensa $GITHUB_REF_NAME" --notes-file artifacts/release-notes.txt)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then args+=(--prerelease); fi
          gh "${args[@]}" artifacts/release/*
