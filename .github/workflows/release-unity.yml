name: Release Unity package
on:
  push:
    tags: ['unity-v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sensa-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      stable: ${{ steps.package.outputs.stable }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: python3 -m unittest discover -s tests/scripts
      - run: python3 scripts/release.py unity
        id: package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-unity
          path: |
            artifacts/release/
            artifacts/release-notes.txt
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-unity
          path: artifacts
      - name: Create immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          args=(release create "$GITHUB_REF_NAME" --verify-tag --title "Sensa Unity $GITHUB_REF_NAME" --notes-file artifacts/release-notes.txt)
          if [[ "$GITHUB_REF_NAME" == *.*.*-* ]]; then args+=(--prerelease); fi
          gh "${args[@]}" artifacts/release/*
  pages:
    needs: [build, release]
    if: ${{ always() && ((needs.release.result == 'success' && needs.build.outputs.stable == 'true') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Rebuild and verify all package links
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/vpm-index.py
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: artifacts/pages
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
