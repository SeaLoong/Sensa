name: Validate and release Unity package / 验证与发布 Unity 包
on:
  push:
    tags: ['unity-v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sensa-pages
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/checks.yml
  e2e:
    needs: validate
    if: github.event_name == 'push'
    uses: ./.github/workflows/e2e.yml
    with:
      update_snapshots: false
  build:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      stable: ${{ steps.package.outputs.stable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Package Unity (manual runs only validate) / 打包 Unity（手动运行仅验证）
        id: package
        env:
          BUILD_LABEL: manual.${{ github.run_number }}.${{ github.sha }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            version=$(python3 -c "import json;print(json.load(open('unity/top.sealoong.sensa/package.json'))['version'])")
            python3 scripts/release.py unity --tag "unity-v$version" --label "$BUILD_LABEL"
          else
            python3 scripts/release.py unity
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-unity
          path: |
            artifacts/release/
            artifacts/release-notes.txt
          if-no-files-found: error
  release:
    concurrency:
      group: sensa-preview-publication
      queue: max
      cancel-in-progress: false
    needs: [build, e2e]
    if: github.event_name == 'push' && needs.e2e.outputs.comparison_sha == github.sha
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-unity
          path: artifacts
      - name: Create immutable release / 创建不可变发布
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          args=(release create "$GITHUB_REF_NAME" --verify-tag --title "Sensa Unity $GITHUB_REF_NAME" --notes-file artifacts/release-notes.txt)
          if [[ "$GITHUB_REF_NAME" == *.*.*-* ]]; then args+=(--prerelease); fi
          gh "${args[@]}" artifacts/release/*
          if [[ "$GITHUB_REF_NAME" == *.*.*-* ]]; then python scripts/publish-preview.py --prune-only; fi
  pages:
    needs: [build, release]
    if: ${{ always() && needs.release.result == 'success' && needs.build.outputs.stable == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check GitHub Pages configuration / 检查 GitHub Pages 配置
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - name: Rebuild and verify package links / 重建并验证全部包链接
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/vpm-index.py
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: artifacts/pages
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
