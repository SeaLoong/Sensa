name: Checks
on:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: true
      require_main:
        type: boolean
        default: false
      run_e2e:
        description: Run the full E2E comparison
        type: boolean
        default: true
    outputs:
      commit:
        value: ${{ jobs.units.outputs.commit }}
      comparison_sha:
        value: ${{ jobs.e2e.outputs.comparison_sha }}
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  units:
    name: Unit checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Require main
        if: inputs.require_main
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: test "$WORKFLOW_REF" = refs/heads/main
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Pin source
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: npm ci
      - name: Check WebUI
        run: |
          npm test
          npm run build:web
      - name: Check Node runtime
        run: npm run test:node
      - name: Build Node runtime
        run: npm run build:node -- --bundle-only
      - name: Check scripts and docs
        run: python -X utf8 -m unittest discover -s tests/scripts
      - name: Check Unity metadata
        run: python scripts/release.py check-unity
      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: tests-backend
          path: artifacts/test-results/backend/
          overwrite: true
          if-no-files-found: warn

  e2e:
    name: E2E
    needs: units
    if: inputs.run_e2e
    uses: ./.github/workflows/e2e.yml
    with:
      source_commit: ${{ needs.units.outputs.commit }}
      update_snapshots: false
