name: Interface verification / 接口验证
on:
  workflow_call:
    inputs:
      web:
        type: boolean
        default: true
      backend:
        type: boolean
        default: true
      scripts:
        type: boolean
        default: true
      docs:
        type: boolean
        default: true
      unity:
        type: boolean
        default: true
      dependencies:
        type: boolean
        default: true
      package_unity:
        type: boolean
        default: false
      label:
        type: string
        default: ''
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  check:
    name: Verify affected interfaces / 验证受影响接口
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.web || inputs.dependencies
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: inputs.scripts || inputs.docs || inputs.unity
        with:
          python-version: '3.14'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: inputs.backend
        with:
          global-json-file: global.json
      - run: npm ci
        if: inputs.web || inputs.dependencies
      - name: Web lint and interface tests / Web 规范与接口测试
        if: inputs.web
        run: npm test
      - name: Audit changed dependencies / 审计变更依赖
        if: inputs.dependencies
        run: npm audit --audit-level=high
      - name: Backend interface tests / 后端接口测试
        if: inputs.backend
        run: |
          dotnet restore tests/Sensa.Tests/Sensa.Tests.csproj --locked-mode
          dotnet test tests/Sensa.Tests/Sensa.Tests.csproj -c Release --no-restore -p:SkipWebBuild=true --logger "trx;LogFileName=backend.trx" --results-directory artifacts/test-results/backend
      - name: Python interface tests / Python 接口测试
        if: inputs.scripts || inputs.unity
        run: python -m unittest discover -s tests/scripts
      - name: Documentation parity / 双语文档一致性
        if: ${{ inputs.docs && !inputs.scripts && !inputs.unity }}
        run: python -m unittest discover -s tests/scripts -p test_bilingual_docs.py
      - name: Unity metadata / Unity 元数据
        if: inputs.unity
        run: python scripts/release.py check-unity
      - name: Package complete candidate Unity assets / 打包完整候选 Unity 资产
        if: inputs.package_unity
        env:
          BUILD_LABEL: ${{ inputs.label }}
        run: |
          VERSION=$(python -c "import json;print(json.load(open('unity/top.sealoong.sensa/package.json'))['version'])")
          python scripts/release.py unity --tag "unity-v$VERSION" --label "$BUILD_LABEL" --output artifacts/unity
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.package_unity
        with:
          name: build-unity
          path: artifacts/unity/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && inputs.backend
        with:
          name: tests-backend
          path: artifacts/test-results/backend/
          if-no-files-found: warn
