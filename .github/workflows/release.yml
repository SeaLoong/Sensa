name: Publish Release / 发布正式版
on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional X.Y.Z; blank selects the next version / 可选版本号，留空自动递增
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: sensa-stable-release
  queue: max
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      source_ref: main
      require_main: true

  build:
    needs: checks
    uses: ./.github/workflows/build.yml
    with:
      source_ref: ${{ needs.checks.outputs.commit }}
      channel: stable
      version: ${{ inputs.version }}

  publish:
    name: Publish stable downloads / 发布正式下载
    needs: [checks, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: sensa-release-publication
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: distribution-*
          path: artifacts/downloaded
      - name: Check publication credential / 检查发布凭据
        env:
          GH_TOKEN: ${{ secrets.SENSA_PAT }}
        run: test -n "$GH_TOKEN" || { echo '::error::Configure the SENSA_PAT repository Actions secret / 请配置仓库 Actions 密钥 SENSA_PAT'; exit 1; }
      - name: Publish archives and generated notes / 发布压缩包与自动说明
        env:
          GH_TOKEN: ${{ secrets.SENSA_PAT }}
          SENSA_E2E_COMPARISON_SHA: ${{ needs.checks.outputs.comparison_sha }}
          BUILD_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.build.outputs.commit }}
          PREVIOUS_TAG: ${{ needs.build.outputs.previous_tag }}
        run: >-
          python scripts/publish-release.py --channel stable
          --version "$BUILD_VERSION" --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT"
          --previous-tag "$PREVIOUS_TAG" --assets artifacts/downloaded

  pages:
    name: Refresh documentation and VPM / 刷新文档与 VPM
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
