name: Publish GitHub Pages / 自动发布文档站
on:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
concurrency:
  group: sensa-pages
  queue: max
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
jobs:
  build:
    name: Build documentation and VPM / 构建文档与 VPM
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - name: Pin documentation source / 固定文档源码
        run: echo "SENSA_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check the documentation generator / 检查文档生成器
        run: node --test tests/web/site.test.mjs
      - name: Collect stable Unity packages / 收集 Unity 正式包
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/vpm-index.py --allow-empty
      - name: Build bilingual documentation / 构建双语文档
        run: GITHUB_SHA="$(git rev-parse HEAD)" npm run build:pages
      - name: Install browser and Chinese fonts / 安装浏览器与中文字体
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Check navigation, language and layout / 检查导航、语言与布局
        id: site_tests
        env:
          E2E_SUITE: site
          E2E_UPDATE_SNAPSHOTS: 'false'
          SENSA_SITE_DIRECTORY: artifacts/pages
        run: npm run e2e:ci
      - name: Record the current site result / 记录本次站点结果
        if: always()
        env:
          E2E_SUITE: site
          E2E_UPDATE_SNAPSHOTS: 'false'
          E2E_COMMAND_OUTCOME: ${{ steps.site_tests.outcome }}
        run: node scripts/e2e-summary-reporter.mjs --finalize-report artifacts/e2e/summary.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: pages-verification
          overwrite: true
          path: |
            artifacts/e2e/report/
            artifacts/e2e/results/
            artifacts/e2e/results.json
            artifacts/e2e/summary.json
            artifacts/e2e/summary.md
            artifacts/pages/site-manifest.json
          retention-days: 14
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: artifacts/pages

  deploy:
    name: Deploy documentation / 部署文档站
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
        with:
          enablement: false
      - name: Publish built site / 发布已构建站点
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
