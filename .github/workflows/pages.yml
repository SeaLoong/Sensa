name: Pages
on:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
concurrency:
  group: sensa-pages
  queue: max
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
jobs:
  build:
    name: Build site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - name: Pin source
        run: echo "SENSA_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check site generator
        run: node --test tests/web/site.test.mjs
      - name: Collect VPM packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/vpm-index.py --allow-empty
      - name: Build docs
        run: GITHUB_SHA="$(git rev-parse HEAD)" npm run build:pages
      - name: Install browser dependencies
        timeout-minutes: 5
        run: bash scripts/install-pages-dependencies.sh
      - name: Install browser
        timeout-minutes: 3
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '30000'
        run: npx playwright install --only-shell chromium
      - name: Check site
        id: site_tests
        env:
          E2E_SUITE: site
          E2E_UPDATE_SNAPSHOTS: 'false'
          SENSA_SITE_DIRECTORY: artifacts/pages
        run: npm run e2e:ci
      - name: Summarize site checks
        if: always()
        env:
          E2E_SUITE: site
          E2E_UPDATE_SNAPSHOTS: 'false'
          E2E_COMMAND_OUTCOME: ${{ steps.site_tests.outcome }}
        run: node scripts/e2e-summary-reporter.mjs --finalize-report artifacts/e2e/summary.json
      - name: Upload site report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: pages-verification
          overwrite: true
          path: |
            artifacts/e2e/report/
            artifacts/e2e/results/
            artifacts/e2e/results.json
            artifacts/e2e/summary.json
            artifacts/e2e/summary.md
            artifacts/pages/site-manifest.json
          retention-days: 14
      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: artifacts/pages

  deploy:
    name: Deploy site
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
        with:
          enablement: false
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
