name: Build
on:
  workflow_call:
    inputs:
      source_ref:
        description: Resolve this source once, then pin every build
        type: string
        required: true
      channel:
        type: string
        required: true
      version:
        description: Optional stable version override
        type: string
        default: ''
    outputs:
      commit:
        value: ${{ jobs.plan.outputs.commit }}
      version:
        value: ${{ jobs.plan.outputs.version }}
      tag:
        value: ${{ jobs.plan.outputs.tag }}
      previous_tag:
        value: ${{ jobs.plan.outputs.previous_tag }}
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  plan:
    name: Prepare build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.plan.outputs.commit }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      label: ${{ steps.plan.outputs.label }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
    steps:
      - name: Require main
        if: inputs.channel == 'stable'
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: test "$WORKFLOW_REF" = refs/heads/main
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - name: Select version
        id: plan
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: python scripts/prepare-release.py --channel "$RELEASE_CHANNEL" --version "$REQUESTED_VERSION"

  desktop:
    name: Desktop (${{ matrix.rid }})
    needs: plan
    # Native dependency/build code must not read or write shared Actions caches.
    cache-mode: none
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-latest, rid: win-x64}
          - {runner: windows-11-arm, rid: win-arm64}
          - {runner: ubuntu-24.04, rid: linux-x64}
          - {runner: ubuntu-24.04-arm, rid: linux-arm64}
          - {runner: macos-15-intel, rid: osx-x64}
          - {runner: macos-15, rid: osx-arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      SENSA_SOURCE_COMMIT: ${{ needs.plan.outputs.commit }}
      BUILD_VERSION: ${{ needs.plan.outputs.version }}
      BUILD_LABEL: ${{ needs.plan.outputs.label }}
      TARGET_RID: ${{ matrix.rid }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - name: Install .NET
        id: dotnet-setup
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        continue-on-error: ${{ matrix.rid == 'win-arm64' }}
        with:
          global-json-file: global.json
      - name: Retry ARM SDK
        if: matrix.rid == 'win-arm64' && steps.dotnet-setup.outcome == 'failure'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - name: Set version
        run: python scripts/prepare-release.py --apply-version "$BUILD_VERSION"
        shell: bash
      - name: Install dependencies
        run: npm ci
      - name: Check native Windows protocol bridge dependencies
        if: startsWith(matrix.rid, 'win-')
        shell: bash
        run: |
          python -m pip install -r tools/protocol-bridge/requirements-ble-input-windows.txt -r tools/protocol-bridge/requirements-ble-output.txt
          python scripts/check-protocol-bridge-windows.py --report "artifacts/test-results/$TARGET_RID/protocol-bridge-dependencies.json"
      - name: Install verified Inno Setup compiler
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: ./scripts/install-inno-setup.ps1
      - name: Package desktop
        shell: bash
        run: python scripts/build-platform.py --runtime "$TARGET_RID" --version "$BUILD_VERSION" --label "$BUILD_LABEL" --smoke ${{ startsWith(matrix.rid, 'win-') && '--windows-extras' || '' }}
      - name: Check Shader bridge
        if: matrix.rid == 'win-x64'
        shell: bash
        run: |
          python -m pip install -r scripts/requirements-capture.txt
          python scripts/smoke-shader-bridge.py --exe artifacts/publish/win-x64/Sensa.exe --first tests/fixtures/shader/sps-telemetry.png --next tests/fixtures/shader/sps-telemetry-next.png --corrupt tests/fixtures/shader/corrupt-telemetry.png --recover-first tests/fixtures/shader/sps-recovery-first.png --recover-next tests/fixtures/shader/sps-recovery-next.png --report artifacts/test-results/win-x64/shader-bridge.json
      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: distribution-${{ matrix.rid }}
          overwrite: true
          path: artifacts/platform/${{ matrix.rid }}/
          if-no-files-found: error
      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: tests-${{ matrix.rid }}
          path: artifacts/test-results/${{ matrix.rid }}/
          overwrite: true
          if-no-files-found: warn

  unity:
    name: Unity package
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SENSA_SOURCE_COMMIT: ${{ needs.plan.outputs.commit }}
      BUILD_VERSION: ${{ needs.plan.outputs.version }}
      BUILD_LABEL: ${{ needs.plan.outputs.label }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - name: Set version
        run: python scripts/prepare-release.py --apply-version "$BUILD_VERSION"
      - name: Package Unity
        run: python scripts/release.py unity --tag "v$BUILD_VERSION" --label "$BUILD_LABEL" --output artifacts/unity
      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: distribution-unity
          overwrite: true
          path: artifacts/unity/
          if-no-files-found: error
