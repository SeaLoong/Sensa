name: E2E
on:
  workflow_call:
    outputs:
      comparison_sha:
        description: Commit verified by full comparison
        value: ${{ jobs.browser.outputs.comparison_sha }}
    inputs:
      source_commit:
        type: string
        required: true
      update_snapshots:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Generate review-only baselines
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  browser:
    name: Browser
    outputs:
      comparison_sha: ${{ steps.comparison.outputs.sha }}
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 35
    env:
      CI: 'true'
      E2E_SUITE: all
      PYTHONUTF8: '1'
      E2E_UPDATE_SNAPSHOTS: ${{ inputs.update_snapshots }}
      SENSA_SOURCE_COMMIT: ${{ inputs.source_commit || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_commit || github.sha }}
      - name: Check baseline mode
        if: inputs.update_snapshots && github.event_name != 'workflow_dispatch'
        run: exit 1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Install test dependencies
        timeout-minutes: 5
        run: bash scripts/install-e2e-dependencies.sh
      - name: Install dependencies
        run: npm ci
      - name: Build app
        run: dotnet publish src/Sensa.csproj -c Release --no-self-contained -p:RestoreLockedMode=true -o artifacts/e2e/app
      - name: Run E2E
        id: browser_tests
        run: npm run e2e:ci
      - name: Verify comparison
        id: comparison
        if: ${{ !inputs.update_snapshots }}
        run: |
          test "$E2E_SUITE" = all
          node scripts/e2e-summary-reporter.mjs --verify-comparison artifacts/e2e/summary.json
          echo "sha=$SENSA_SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
      - name: Summarize E2E
        if: always()
        env:
          E2E_COMMAND_OUTCOME: ${{ steps.browser_tests.outcome }}
        run: node scripts/e2e-summary-reporter.mjs --finalize-report artifacts/e2e/summary.json
      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: e2e-report
          overwrite: true
          path: |
            artifacts/e2e/report/
            artifacts/e2e/results/
            artifacts/e2e/results.json
            artifacts/e2e/summary.json
            artifacts/e2e/summary.md
            artifacts/e2e/ui-quality/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload candidate images
        if: always() && inputs.update_snapshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: e2e-baselines
          overwrite: true
          path: tests/e2e/__screenshots__/
          if-no-files-found: warn
          retention-days: 14
