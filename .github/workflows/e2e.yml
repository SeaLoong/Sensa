name: WebUI E2E and screenshots
on:
  workflow_call:
    inputs:
      update_snapshots:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Generate review-only screenshot baselines (never publishes a release)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 25
    env:
      CI: 'true'
      PYTHONUTF8: '1'
      E2E_UPDATE_SNAPSHOTS: ${{ inputs.update_snapshots }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Reject baseline updates from ordinary CI
        if: inputs.update_snapshots && github.event_name != 'workflow_dispatch'
        run: exit 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Install deterministic language support and PTY mock runtime
        run: apt-get update && apt-get install -y --no-install-recommends fonts-noto-cjk python3
      - run: npm ci
      - name: Build real Sensa application
        run: dotnet publish src/Sensa.csproj -c Release --no-self-contained -p:RestoreLockedMode=true -o artifacts/e2e/app
      - name: Exercise UI, real transports and screenshot comparisons
        run: npm run e2e:ci
      - name: Retain report, screenshots, diffs, traces and mock traffic
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: e2e-report
          path: |
            artifacts/e2e/report/
            artifacts/e2e/results/
            artifacts/e2e/results.json
          if-no-files-found: warn
          retention-days: 14
      - name: Export proposed baselines for human review
        if: always() && inputs.update_snapshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: e2e-baselines
          path: tests/e2e/__screenshots__/
          if-no-files-found: warn
          retention-days: 14
