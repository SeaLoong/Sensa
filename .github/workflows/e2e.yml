name: Capture preset interaction
on: workflow_dispatch
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.2'
          cache: npm
      - run: bash scripts/install-e2e-dependencies.sh
      - run: apt-get update -qq && apt-get install -y --no-install-recommends imagemagick xauth
      - run: npm ci
      - run: npm run build:node -- --bundle-only
      - run: xvfb-run -a -s "-screen 0 1440x1100x24" npx playwright test capture-presets.spec.js --project=desktop --headed --reporter=line
      - run: npx playwright test i18n.spec.js --grep "English presets, script and compact help" --reporter=line
      - name: Capture mapping page comparison candidates
        env:
          E2E_UPDATE_SNAPSHOTS: 'true'
        run: |
          npx playwright test flows.spec.js --grep "modern Socket preset uses NewRoot" --reporter=line
          for project in desktop mobile; do
            mkdir -p "artifacts/preset-interaction/$project"
            cp "tests/e2e/__screenshots__/$project/osc-mappings-page.png" "artifacts/preset-interaction/$project/"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: preset-interaction
          path: artifacts/preset-interaction
