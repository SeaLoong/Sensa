name: Validate and preview / 验证与预览
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
concurrency:
  # Preserve main product verification when a later docs-only commit arrives.
  # 后续纯文档提交不应取消 main 上尚未完成的产品验证。
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  plan:
    name: Select necessary checks / 选择必要检查
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      web: ${{ steps.plan.outputs.web }}
      backend: ${{ steps.plan.outputs.backend }}
      scripts: ${{ steps.plan.outputs.scripts }}
      docs: ${{ steps.plan.outputs.docs }}
      unity: ${{ steps.plan.outputs.unity }}
      dependencies: ${{ steps.plan.outputs.dependencies }}
      e2e: ${{ steps.plan.outputs.e2e }}
      platforms: ${{ steps.plan.outputs.platforms }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Plan changed paths / 规划变更路径
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/ci-plan.py --base "$BASE_SHA" --format github

  validate:
    needs: plan
    uses: ./.github/workflows/checks.yml
    with:
      web: ${{ needs.plan.outputs.web == 'true' }}
      backend: ${{ needs.plan.outputs.backend == 'true' }}
      scripts: ${{ needs.plan.outputs.scripts == 'true' }}
      docs: ${{ needs.plan.outputs.docs == 'true' }}
      unity: ${{ needs.plan.outputs.unity == 'true' }}
      dependencies: ${{ needs.plan.outputs.dependencies == 'true' }}
      package_unity: ${{ needs.plan.outputs.platforms == 'true' }}
      label: preview.${{ github.run_number }}.${{ github.sha }}

  e2e:
    needs: [plan, validate]
    if: needs.plan.outputs.e2e == 'true'
    uses: ./.github/workflows/e2e.yml
    with:
      update_snapshots: false

  platforms:
    needs: [plan, validate, e2e]
    if: needs.plan.outputs.platforms == 'true'
    uses: ./.github/workflows/build-platforms.yml
    with:
      label: preview.${{ github.run_number }}.${{ github.sha }}

  prerelease:
    name: Publish verified preview / 发布已验证预览
    concurrency:
      group: sensa-preview-publication
      cancel-in-progress: false
    needs: [plan, validate, e2e, platforms]
    if: >-
      always() &&
      needs.plan.outputs.prerelease == 'true' &&
      needs.validate.result == 'success' &&
      needs.platforms.result == 'success' &&
      needs.e2e.result == 'success' &&
      needs.e2e.outputs.comparison_sha == github.sha &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          path: artifacts/downloaded
      - name: Publish and retain latest ten prereleases / 发布并保留最近十个预发布
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SENSA_E2E_COMPARISON_SHA: ${{ needs.e2e.outputs.comparison_sha }}
        run: python scripts/publish-preview.py
