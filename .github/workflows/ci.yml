name: Validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high
      - run: dotnet restore tests/Sensa.Tests/Sensa.Tests.csproj --locked-mode
      - run: dotnet test tests/Sensa.Tests/Sensa.Tests.csproj -c Release --no-restore
      - run: python scripts/release.py check-unity
      - run: python -m unittest discover -s tests/scripts
      - run: python scripts/smoke.py --dll bin/Sensa/Release/net10.0/Sensa.dll
