version: 2
updates:
  - package-ecosystem: nuget
    directory: /src
    schedule:
      interval: weekly
  - package-ecosystem: nuget
    directory: /tests/Sensa.Tests
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /tools/protocol-bridge
    schedule:
      interval: weekly
    groups:
      bluetooth-backends:
        patterns: [bleak, bless]
      native-winrt:
        patterns: [winrt-*]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      react-runtime:
        patterns: [react, react-dom]
      react-security:
        applies-to: security-updates
        patterns: [react, react-dom]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
