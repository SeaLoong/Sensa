version: 2
updates:
  - package-ecosystem: nuget
    directory: /src
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      react-runtime:
        patterns: [react, react-dom]
      react-security:
        applies-to: security-updates
        patterns: [react, react-dom]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
